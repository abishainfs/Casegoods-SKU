name: Shop check (casegoods.in)

# Compares the live shop with the catalogue and updates reports/store-check.md,
# reports/store-sku-suggestions.csv and store.json. It only READS the shop.
on:
  schedule:
    - cron: '17 3 * * 1'      # every Monday morning (India time)
  workflow_dispatch:          # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths: ['products.json', 'materials.json']

permissions:
  contents: write

concurrency:
  group: store-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compare casegoods.in with the catalogue
        run: node scripts/store-check.js
      - name: Save the results
        run: |
          git config user.name "casegoods-sku-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store.json reports/
          # The script only rewrites files when something other than the date changed.
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Shop check: update reports"
            git pull --rebase origin main && git push
          fi
